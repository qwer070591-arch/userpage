<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>縣市資料應用</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/mycss01.css">
    <style>
        .card-img-top {
            height: 220px;
            object-fit: cover;
        }
    </style>

</head>

<body>
    <div id="app" class="container my-4">
        <div class="display-2 text-center fw-bold text-bg-success py-3 rounded rounded-3">
            {{ title }}
        </div>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <select name="" id="" class="form-select form-select-lg mt-3" v-model="selectedCity"
                    @change="getAreaList">
                    <option value="" disabled selected class="text-center">選擇縣市名稱</option>
                    <option :value="item.CityName" v-for="item in cityData">
                        {{ item.CityName }}
                    </option>
                </select>

                <select name="" id="" class="form-select form-select-lg mt-3" v-model="selectedArea"
                    @change="filterHotelData">
                    <option value="" disabled selected class="text-center">選擇鄉鎮區名稱</option>
                    <option :value="item.AreaName" v-for="item in AreaListData">
                        {{ item.AreaName }}
                    </option>
                </select>
            </div>
            <div class="row">
                <div class="col-12 mt-4">
                    <div class="alert alert-success">
                        搜尋地區:
                        <span class="fw-bold">{{ selectedCity }} {{ selectedArea }}</span>
                        .共找到
                        <span class="text-danger fw-bold">{{ filterHotel.length }}</span>
                        筆旅館資料
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-12 mt-4">
                    <div class="alert alert-warning" v-if="selectedCity && selectedArea && filterHotel.length == 0">
                        此地區沒有旅館
                    </div>
                </div>
            </div>

            <!-- 頁碼 -->
            <div class="row">
                <div class="col-12">
                    <nav aria-label="Page navigation example">
                        <ul class="pagination justify-content-center">
                            <li class="page-item"><a class="page-link" href="#">Previous</a></li>
                            <li class="page-item" v-for="item in totalPage">
                                <a class="page-link" href="#">{{ item }}</a>
                            </li>
                            <li class="page-item"><a class="page-link" href="#">Next</a></li>
                        </ul>
                    </nav>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 col-xl-3 mt-3" v-for="item in pageHotelData">
                    <div class="card h-100">
                        <img :src="item.img" class="card-img-top" alt="...">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">{{ item.name }}</h5>
                            <p class="card-text">地址: {{ item.city }} {{ item.town }} {{ item.streetAddress }}</p>
                            <p class="card-text">電話: {{ item.tel }}</p>
                            <p class="card-text">簡介: {{ item.description }} ...</p>
                            <a href="#" class="btn btn-outline-primary w-100 mt-auto">查看</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <script>
        const App = {
            data() {
                return {
                    title: "縣市資料應用",
                    cityData: [],
                    AreaListData: [],
                    selectedCity: '',
                    selectedArea: '',

                    //所有的旅館飯店資料
                    HotelData: [],
                    //過濾後的旅館飯店資料
                    filterHotel: [],
                    //每頁顯示的筆數
                    pageSize: 8,
                    //目前頁數
                    currentPage: 1
                }
            },
            methods: {
                getCityData() {
                    const vm = this;
                    axios.get('js/CityCountyData.json')
                        .then(function (response) {
                            console.log(response);
                            vm.cityData = response.data
                        })
                        .catch(function (error) {
                            console.log(error);
                        })
                        .finally(function () {
                            // always executed
                        });
                },
                getHotelData() {
                    const vm = this;
                    axios.get('js/HotelList.json')
                        .then(function (response) {
                            console.log(response.data.Hotels);
                            // vm.HotelData = response.data.Hotels;
                            // 將清洗完的資料放入HotelData
                            // name, img, 簡介, 電話, 地址
                            vm.HotelData = response.data.Hotels.map(function (item, index) {
                                return {
                                    id: index + 1,
                                    name: (item.HotelName ?? "未提供店名").trim(),
                                    description: (item.Description ?? "未提供簡介").trim().substring(0, 10),
                                    tel: (item.Telephones[0].Tel ?? "未提供電話").trim(),
                                    city: (item.PostalAddress.City ?? "未提供縣市名稱").trim(),
                                    town: (item.PostalAddress.Town ?? "未提供鄉鎮區名稱").trim(),
                                    streetAddress: (item.PostalAddress.StreetAddress ?? "未提供道路地址").trim(),
                                    img: item?.Images[0]?.URL ?? "images/landscape01.avif"
                                }
                            });

                        })
                        .catch(function (error) {
                            console.log(error);
                        })
                        .finally(function () {
                            // always executed
                        });
                },
                getAreaList() {
                    const vm = this;
                    vm.cityData.forEach(function (item) {
                        if (item.CityName == vm.selectedCity) {
                            vm.AreaListData = item.AreaList;
                        }
                    });
                },
                filterHotelData() {
                    const vm = this;
                    vm.filterHotel = vm.HotelData.filter(function (item) {
                        return item.city == vm.selectedCity && item.town == vm.selectedArea
                    });

                }
            },
            mounted() {
                const vm = this;
                vm.getCityData();
                vm.getHotelData();
            },
            computed: {
                //計算總頁數
                totalPage() {
                    return Math.ceil(this.filterHotel.length / this.pageSize)
                },

                //取得目前頁面的旅館資料
                pageHotelData() {
                    const start = (this.currentPage - 1) * this.pageSize;
                    const end = start + this.pageSize;

                    return this.filterHotel.slice(start, end)
                }
            }
        }
        Vue.createApp(App).mount("#app")
    </script>
</body>

</html>
